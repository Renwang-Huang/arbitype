name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install lint tool
        run: python -m pip install "ruff>=0.8,<1"
      - name: Lint
        run: python -m ruff check arbitype typesafe_mcp typesafe_codex_mcp server.py smoke_test.py scripts tests
      - name: Validate publication metadata
        run: python scripts/validate_registry_metadata.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
      - name: Inspect wheel
        run: |
          python -c "import glob, zipfile; paths=glob.glob('dist/*.whl'); assert len(paths)==1, paths; names=zipfile.ZipFile(paths[0]).namelist(); bad=[n for n in names if '__pycache__' in n or n.endswith('.pyc')]; assert not bad, bad"

  package-install:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/arbitype-venv
          /tmp/arbitype-venv/bin/python -m pip install --no-deps dist/*.whl
          /tmp/arbitype-venv/bin/arbitype --version
          /tmp/arbitype-venv/bin/typesafe-mcp --version
          /tmp/arbitype-venv/bin/typesafe-codex-mcp --version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' '{"jsonrpc":"2.0","id":2,"method":"shutdown","params":{}}' '{"jsonrpc":"2.0","method":"exit"}' | /tmp/arbitype-venv/bin/arbitype

  official-sdk-interop:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install official MCP client
        run: python -m pip install "mcp[cli]>=2,<3"
      - name: Run official SDK STDIO smoke test
        run: python scripts/official_sdk_smoke.py

  release-readiness:
    runs-on: ubuntu-latest
    needs: [test, package-install, official-sdk-interop]
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install release-check development tools
        run: python -m pip install "mcp[cli]>=2,<3" "ruff>=0.8,<1"
      - name: Install pinned MCP Registry publisher
        shell: bash
        run: |
          set -euo pipefail
          publisher_dir="$(mktemp -d)"
          asset="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${asset}" \
            --output "$publisher_dir/mcp-publisher.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $publisher_dir/mcp-publisher.tar.gz" \
            | sha256sum --check --status
          tar -xzf "$publisher_dir/mcp-publisher.tar.gz" -C "$publisher_dir" mcp-publisher
          chmod +x "$publisher_dir/mcp-publisher"
          echo "$publisher_dir" >> "$GITHUB_PATH"
          "$publisher_dir/mcp-publisher" --version
      - name: Validate server.json with official MCP publisher
        run: mcp-publisher validate
      - name: Run release readiness gate
        run: python scripts/release_readiness.py
