name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
      - name: Inspect wheel
        run: |
          python -c "import glob, zipfile; paths=glob.glob('dist/*.whl'); assert len(paths)==1, paths; names=zipfile.ZipFile(paths[0]).namelist(); bad=[n for n in names if '__pycache__' in n or n.endswith('.pyc')]; assert not bad, bad"

  package-install:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/typesafe-mcp-venv
          /tmp/typesafe-mcp-venv/bin/python -m pip install --no-deps dist/*.whl
          /tmp/typesafe-mcp-venv/bin/typesafe-mcp --version
          /tmp/typesafe-mcp-venv/bin/typesafe-codex-mcp --version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' '{"jsonrpc":"2.0","id":2,"method":"shutdown","params":{}}' '{"jsonrpc":"2.0","method":"exit"}' | /tmp/typesafe-mcp-venv/bin/typesafe-mcp
