name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package (for example, main or v0.5.1)
        required: true
        default: main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/typesafe-mcp
    steps:
      - name: Check out package source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python -c 'from typesafe_mcp._version import __version__; print(__version__)')"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* || "$tag_version" != "$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

      - name: Run release checks
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Build distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel
          python -m twine check dist/*

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
