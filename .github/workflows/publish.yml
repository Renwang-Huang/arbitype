name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package (for example, main or v0.6.0)
        required: true
        default: main

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/arbitype
    steps:
      - name: Check out package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python -c 'from arbitype._version import __version__; print(__version__)')"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* || "$tag_version" != "$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

      - name: Run release checks
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Build distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel
          python -m twine check dist/*

      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
