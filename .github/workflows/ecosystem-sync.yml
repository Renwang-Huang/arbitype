name: Verify ecosystem listings

on:
  workflow_run:
    workflows:
      - Publish to MCP Registry
    types: [completed]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to inspect
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Resolve package version
        id: version
        run: echo "version=$(python -c 'from arbitype._version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Verify Registry and Glama listings
        env:
          STRICT: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
        run: |
          if [ "$STRICT" = "1" ]; then
            python scripts/check_ecosystem_sync.py --version "${{ steps.version.outputs.version }}" --strict
          else
            python scripts/check_ecosystem_sync.py --version "${{ steps.version.outputs.version }}"
          fi
