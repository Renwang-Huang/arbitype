[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typesafe-mcp"
version = "0.5.0"
description = "A dependency-free, host-neutral TypeSafe AI MCP service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TypeSafe MCP contributors" }]
keywords = ["typesafe", "jev", "mcp", "ai", "agents", "claude", "classification", "guardrails"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Renwang-Huang/typesafe-mcp"
Repository = "https://github.com/Renwang-Huang/typesafe-mcp"
Issues = "https://github.com/Renwang-Huang/typesafe-mcp/issues"
Changelog = "https://github.com/Renwang-Huang/typesafe-mcp/blob/main/CHANGELOG.md"

[project.scripts]
typesafe-mcp = "typesafe_mcp.cli:main"
typesafe-codex-mcp = "typesafe_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["typesafe_mcp*", "typesafe_codex_mcp*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "__pycache__/*", "*.py[cod]"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
