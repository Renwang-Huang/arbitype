[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitype"
dynamic = ["version"]
description = "Typed decision tools for AI agents, powered by TypeSafe Jev"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arbitype contributors" }]
keywords = ["arbitype", "mcp", "model-context-protocol", "ai-agents", "agent", "decision", "typed-decisions", "classification", "routing", "verification", "guardrails", "jev", "typesafe-ai", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Renwang-Huang/arbitype"
Repository = "https://github.com/Renwang-Huang/arbitype"
Issues = "https://github.com/Renwang-Huang/arbitype/issues"
Changelog = "https://github.com/Renwang-Huang/arbitype/blob/main/CHANGELOG.md"

[project.scripts]
arbitype = "arbitype.cli:main"
typesafe-mcp = "arbitype.cli:main"
typesafe-codex-mcp = "arbitype.cli:main"

[tool.setuptools.packages.find]
include = ["arbitype*", "typesafe_mcp*", "typesafe_codex_mcp*"]

[tool.setuptools.dynamic]
version = { attr = "arbitype._version.__version__" }

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "__pycache__/*", "*.py[cod]"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
