[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typesafe-codex-mcp"
version = "0.2.0"
description = "A dependency-free TypeSafe AI bridge for Codex, MCP clients, and CI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TypeSafe Codex MCP contributors" }]
keywords = ["typesafe", "jev", "mcp", "codex", "ai", "classification", "guardrails"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Renwang-Huang/typesafe-codex-mcp"
Repository = "https://github.com/Renwang-Huang/typesafe-codex-mcp"
Issues = "https://github.com/Renwang-Huang/typesafe-codex-mcp/issues"
Changelog = "https://github.com/Renwang-Huang/typesafe-codex-mcp/blob/main/CHANGELOG.md"

[project.scripts]
typesafe-codex-mcp = "typesafe_codex_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["typesafe_codex_mcp*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "__pycache__/*", "*.py[cod]"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
